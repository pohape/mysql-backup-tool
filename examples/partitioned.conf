# A large table split along a one-way lifecycle.
#
# This is what makes the method scale. A table of a million rows dumped whole
# is rewritten by git on every run. Split it by a column whose values stop
# changing — a finished job, a closed account, a past day — and each value gets
# a file that becomes byte-identical forever once its subject is done. Git
# stores that blob once; every later backup adds nothing for it.

connect_native
credentials_from_env_file "$HOME/app/.env" \
    --user MYSQL_USER --password MYSQL_PASSWORD \
    --database MYSQL_DATABASE --host-port MYSQL_HOST_PORT

repository "$HOME/app-backup" --branch main

# The heartbeat registry is rebuilt from scratch every time a worker starts.
# Restoring it would resurrect workers that no longer exist.
table_exclude workers

# jobs.* rows belong to a run; a run either is still going or has finished and
# will never change again.
#
#   --list   two columns: the value to match, and the filename to use.
#   --key    the column in the partitioned table holding that value.
#   --stable which values can no longer change. Their files are not re-dumped.
#            A fresh dump would be byte-identical anyway, so this saves the
#            database work and nothing else — correctness never depends on it.
partition job_results --dir data/jobs \
    --list  "SELECT id, name FROM job_runs" \
    --key   run_id \
    --stable "SELECT id FROM job_runs WHERE state = 'finished'"

# Names coming out of --list become filenames, so they must be filesystem-safe.
# The tool refuses names containing anything outside [A-Za-z0-9._-] rather than
# quietly mangling them: a renamed file no longer matches its data. If your
# names are freeform, sanitise them in the query itself, for example:
#
#   SELECT id, REGEXP_REPLACE(name, '[^A-Za-z0-9._-]', '_') FROM job_runs
#
# and make sure the result is still unique.

freshness 7200   # hourly backup, one hour of slack
