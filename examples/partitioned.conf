# A large table split along a one-way lifecycle.
#
# This is what makes the method scale. A million-row table dumped whole is
# rewritten by git on every run. Split it by a column whose values stop
# changing — a finished job, a closed account, a past day — and each value gets
# a file that becomes byte-identical forever once its subject is done. Git
# stores that file once; every later backup adds nothing for it.

ENV_FILE="$HOME/app/.env"
ENV_USER_KEY=MYSQL_USER
ENV_PASSWORD_KEY=MYSQL_PASSWORD
ENV_DATABASE_KEY=MYSQL_DATABASE
ENV_HOSTPORT_KEY=MYSQL_HOST_PORT   # for "host:port" held in one variable

REPO="$HOME/app-backup"
BRANCH=main

# The heartbeat registry is rebuilt whenever a worker starts. Restoring it
# would resurrect workers that no longer exist.
table_exclude workers

#   --list    two columns: the value to match, and the filename to use
#   --key     the column in the partitioned table holding that value
#   --stable  which values can no longer change; their files are not re-dumped.
#             A fresh dump would be byte-identical anyway, so this saves the
#             database work and nothing else — correctness never depends on it.
partition job_results --dir data/jobs \
    --list   "SELECT id, name FROM job_runs" \
    --key    run_id \
    --stable "SELECT id FROM job_runs WHERE state = 'finished'"

# Names from --list become filenames, so they must be filesystem-safe. The tool
# refuses anything outside [A-Za-z0-9._-] rather than quietly mangling it: a
# renamed file no longer matches its data. If your names are freeform, sanitise
# them in the query and make sure the result is still unique:
#
#   SELECT id, REGEXP_REPLACE(name, '[^A-Za-z0-9._-]', '_') FROM job_runs

FRESHNESS=7200   # hourly, plus an hour
