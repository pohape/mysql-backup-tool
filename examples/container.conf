# A database running in a container.
#
# Three details separate a container setup that works from one that fails at
# 4am from cron. All three are shown below.

# 1. Which container. `connect_docker` takes a container name; use
#    `connect_compose <file> <service>` when you address it through Compose,
#    where the service name is frequently not the container name.
connect_docker myapp-db
# connect_compose "$HOME/myapp/docker-compose.yml" db

# 2. Which client binary. MariaDB 11 renamed the tools and deprecated the old
#    names; MySQL and MariaDB 10 still use mysqldump/mysql. Pin what the image
#    actually ships instead of relying on a compatibility symlink that may be
#    gone in the next tag.
client_binaries mariadb-dump mariadb

# 3. Where the password comes from. Reading it from the container's own
#    environment is the strongest option available: the password is never
#    written to a file on the host, never passed as an argument, and never
#    enters this tool's memory. It only works if the image was started with the
#    standard MYSQL_* variables, which the official images are.
credentials_from_container_env
#
# If the credentials live in a .env on the host instead, use this. The password
# is then handed to the container over stdin rather than on a command line, so
# it still never appears in `ps` output.
#
# credentials_from_env_file "$HOME/myapp/.env" \
#     --user DB_USER --password DB_PASSWORD --database DB_NAME

repository "$HOME/myapp-backup" --branch main

# Rootless Docker keeps its socket under the user's runtime directory, and cron
# does not read ~/.bashrc. Without this the backup works perfectly by hand and
# fails from cron with "cannot connect to the Docker daemon" — declare it and
# the problem never happens.
#
# docker_rootless

freshness 172800
