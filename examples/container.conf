# A database running in a Docker container.
#
# The dump runs inside the container, so the host needs no mysql client and the
# database port does not have to be exposed to the host.

DB_CONTAINER=myapp-db

# MariaDB 11 renamed the tools and deprecated the old names; MySQL and
# MariaDB 10 still use mysqldump/mysql. Pin what the image actually ships.
DUMP_BIN=mariadb-dump
CLIENT_BIN=mariadb

# The safest option: the password is read inside the container from its own
# environment. It is never written to a file on the host, never passed as an
# argument, and never enters this tool's memory. Works with the official
# images, which are started with the standard MYSQL_* variables.
CREDS_IN_CONTAINER=1

# If the credentials live in a .env on the host instead, use this. The password
# is then handed to the container over stdin, so it still never appears in `ps`.
#
# ENV_FILE="$HOME/myapp/.env"
# ENV_USER_KEY=DB_USER
# ENV_PASSWORD_KEY=DB_PASSWORD
# ENV_DATABASE_KEY=DB_NAME

REPO="$HOME/myapp-backup"
BRANCH=main

# Rootless Docker keeps its socket under the user's runtime directory, and cron
# does not read ~/.bashrc. Without this the backup works perfectly by hand and
# fails from cron with "cannot connect to the Docker daemon".
# ROOTLESS_DOCKER=1

FRESHNESS=172800
