# A whole database, dumped one file per table.
#
# The right starting point for most projects: no partitioning, no tuning. Each
# table becomes data/<table>.sql, so a change to one table produces a diff in
# one file instead of rewriting a single monolithic dump.

connect_native --host 127.0.0.1 --port 3306

credentials_from_env_file "$HOME/myapp/.env" \
    --user     DB_USERNAME \
    --password DB_PASSWORD \
    --database DB_DATABASE

repository "$HOME/myapp-backup" --branch main

# Sessions are rebuilt on login; restoring stale ones would only log everyone
# out at an unpredictable moment.
table_exclude sessions

# The audit log is enormous and is already shipped to the log collector. Keep
# the structure so a restored database is complete, drop the rows.
table_schema_only audit_log

# Expected interval plus a margin, in seconds. `check-fresh` compares against
# this; a monitoring system that greps for FRESH will then notice a backup that
# stopped running, which is the failure that actually happens.
freshness 90000   # daily backup + 90 minutes of slack
