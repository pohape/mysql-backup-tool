# A whole database, one file per table.
#
# The right starting point for most projects. Each table becomes
# data/<table>.sql, so a change in one table produces a diff in one file
# instead of rewriting a single monolithic dump.

DB_HOST=127.0.0.1
DB_PORT=3306

# Read the credentials from the application's own .env instead of repeating
# them here. Only the named keys are read; the file is never sourced.
ENV_FILE="$HOME/myapp/.env"
ENV_USER_KEY=DB_USERNAME
ENV_PASSWORD_KEY=DB_PASSWORD
ENV_DATABASE_KEY=DB_DATABASE

REPO="$HOME/myapp-backup"
BRANCH=main

# Sessions are rebuilt on login; restoring old ones only logs everyone out at
# an unpredictable moment.
table_exclude sessions

# The audit log is enormous and already goes to the log collector. Keep the
# structure so a restored database is complete, drop the rows.
table_schema_only audit_log

# Used by check-fresh: the expected interval plus some slack, in seconds.
FRESHNESS=90000   # daily, plus 90 minutes
